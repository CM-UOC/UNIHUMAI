<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cosmic Architecture | Story of AI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .7; transform: scale(0.95); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        body {
            background-color: #020617; 
            color: white;
            margin: 0;
            overflow-x: hidden;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            scroll-behavior: smooth;
        }
        
        .cursor-none { cursor: none; }

        .glass-card {
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-card:hover {
            transform: translateY(-8px) scale(1.01);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                if (iconRef.current && window.lucide && window.lucide.icons[name]) {
                    const iconElement = window.lucide.icons[name];
                    const svgString = window.lucide.createElement(iconElement).outerHTML;
                    iconRef.current.innerHTML = svgString;
                    
                    const svg = iconRef.current.querySelector('svg');
                    if(svg) {
                        svg.setAttribute('width', size);
                        svg.setAttribute('height', size);
                        if(className) {
                            svg.setAttribute('class', className);
                        }
                    }
                }
            }, [name, size, className]);

            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`} />;
        };

        const CinematicOverlays = () => {
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
            const [isHovering, setIsHovering] = useState(false);

            useEffect(() => {
                const handleMouseMove = (e) => {
                    setMousePos({ x: e.clientX, y: e.clientY });
                    const target = e.target;
                    setIsHovering(
                        window.getComputedStyle(target).cursor === 'pointer' || 
                        target.tagName.toLowerCase() === 'a' || 
                        target.tagName.toLowerCase() === 'button' ||
                        target.closest('.interactive-hover') !== null
                    );
                };
                window.addEventListener('mousemove', handleMouseMove);
                return () => window.removeEventListener('mousemove', handleMouseMove);
            }, []);

            return (
                <React.Fragment>
                    <div 
                        className="fixed inset-0 z-[100] opacity-[0.04] pointer-events-none mix-blend-overlay"
                        style={{ backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E")` }}
                    />
                    <div 
                        className="fixed top-0 left-0 w-8 h-8 rounded-full pointer-events-none z-[200] transform -translate-x-1/2 -translate-y-1/2 transition-transform duration-100 flex items-center justify-center"
                        style={{ left: mousePos.x, top: mousePos.y }}
                    >
                        <div className={`w-2 h-2 bg-white rounded-full transition-all duration-300 shadow-[0_0_12px_rgba(255,255,255,1)] ${isHovering ? 'scale-[3] opacity-30 blur-[1px]' : 'scale-100 opacity-100'}`} />
                        <div className={`absolute w-10 h-10 border border-white/20 rounded-full transition-all duration-500 ${isHovering ? 'scale-[1.8] opacity-0' : 'scale-100 opacity-100'}`} />
                    </div>
                </React.Fragment>
            );
        };

        const CinematicCanvas = ({ activeEra }) => {
            const canvasRef = useRef(null);
            const mouseRef = useRef({ x: 0, y: 0, targetX: 0, targetY: 0 });

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let particles = [];
                const fov = 350;
                
                const eraConfig = {
                    hero: { speed: 0.3, connectDistance: 130, color: 'rgba(255, 255, 255, 0.4)', behavior: 'drift', glow: 8 },
                    fractal: { speed: 0.12, connectDistance: 280, color: 'rgba(125, 211, 252, 0.5)', behavior: 'web', glow: 15 },
                    synthetic: { speed: 2.5, connectDistance: 140, color: 'rgba(167, 139, 250, 0.6)', behavior: 'stream', glow: 12 },
                    quantum: { speed: 1.5, connectDistance: 320, color: 'rgba(244, 114, 182, 0.5)', behavior: 'entangled', glow: 20 },
                    omega: { speed: 0.01, connectDistance: 500, color: 'rgba(253, 224, 71, 0.8)', behavior: 'singularity', glow: 35 }
                };

                let currentConfig = { ...eraConfig.hero };
                let omegaPhase = 'implode'; 
                let omegaTimer = 0;
                let bgColor = { r: 2, g: 6, b: 23 };

                const handleMouseMove = (e) => {
                    mouseRef.current.targetX = (e.clientX / window.innerWidth - 0.5) * 2;
                    mouseRef.current.targetY = (e.clientY / window.innerHeight - 0.5) * 2;
                };
                window.addEventListener('mousemove', handleMouseMove);

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    initParticles();
                };

                class Particle {
                    constructor() {
                        this.reset();
                        this.z = Math.random() * 1500;
                        this.pColor = null; 
                    }

                    reset() {
                        this.x = (Math.random() - 0.5) * canvas.width * 3;
                        this.y = (Math.random() - 0.5) * canvas.height * 3;
                        this.z = 1500 + Math.random() * 500;
                        this.vx = (Math.random() - 0.5) * 1.5;
                        this.vy = (Math.random() - 0.5) * 1.5;
                        this.vz = -Math.random() * 2 - 0.5;
                        this.angle = Math.random() * Math.PI * 2;
                        this.pulse = Math.random() * Math.PI;
                        this.pColor = null;
                    }

                    update(config, mouse) {
                        this.x -= mouse.x * 1.5;
                        this.y -= mouse.y * 1.5;

                        if (config.behavior === 'drift') {
                            this.z += this.vz * config.speed;
                            this.x += this.vx * config.speed;
                            this.y += this.vy * config.speed;
                        } else if (config.behavior === 'web') {
                            this.z += (this.vz * 0.1) * config.speed; 
                            this.x += Math.sin(this.angle) * 0.3;
                            this.y += Math.cos(this.angle) * 0.3;
                            this.angle += 0.003;
                        } else if (config.behavior === 'stream') {
                            this.z += (this.vz * 4) * config.speed; 
                            this.angle += 0.1;
                            this.x += Math.sin(this.angle) * 2.5;
                        } else if (config.behavior === 'entangled') {
                            this.z += this.vz * config.speed;
                            this.angle += 0.15;
                            this.x += (Math.random() - 0.5) * 25;
                            this.y += (Math.random() - 0.5) * 25;
                        } else if (config.behavior === 'singularity') {
                            if (omegaPhase === 'implode') {
                                this.x += (0 - this.x) * 0.02;
                                this.y += (0 - this.y) * 0.02;
                                this.z += (750 - this.z) * 0.02;
                                this.pulse += 0.1;
                                this.pColor = null;
                            } else if (omegaPhase === 'explode' || omegaPhase === 'corona') {
                                this.x += this.vx;
                                this.y += this.vy;
                                this.z += this.vz;
                                
                                this.vx *= 0.94;
                                this.vy *= 0.94;
                                this.vz *= 0.94;
                                this.pulse += 0.1;
                                
                                if (omegaPhase === 'corona') {
                                    // Flowing beautiful cosmic paths (Spiraling Fountain)
                                    this.angle += 0.02;
                                    this.x += Math.sin(this.angle * 1.5) * 3 + this.vx * 0.5;
                                    this.y += Math.cos(this.angle * 1.5) * 3 + this.vy * 0.5;
                                    
                                    // Gentle outward drift
                                    this.x += this.x * 0.002;
                                    this.y += this.y * 0.002;
                                    this.z += this.vz * 0.4;

                                    // Continuous rebirth from the center to keep it flowing beautifully
                                    if (this.z < -200 || this.z > 2500 || Math.abs(this.x) > 2500 || Math.abs(this.y) > 2500 || Math.random() < 0.005) {
                                        this.x = (Math.random() - 0.5) * 15;
                                        this.y = (Math.random() - 0.5) * 15;
                                        this.z = 750 + (Math.random() - 0.5) * 50;
                                        const angle = Math.random() * Math.PI * 2;
                                        const speed = 2 + Math.random() * 8;
                                        this.vx = Math.sin(angle) * speed;
                                        this.vy = Math.cos(angle) * speed;
                                        this.vz = (Math.random() - 0.5) * 15;
                                        this.angle = angle;
                                        
                                        const pColors = [
                                            'rgba(255, 255, 255, 1)',    
                                            'rgba(253, 224, 71, 1)',     
                                            'rgba(45, 212, 191, 1)',    
                                            'rgba(236, 72, 153, 1)'      
                                        ];
                                        this.pColor = pColors[Math.floor(Math.random() * pColors.length)];
                                    }
                                }
                            }
                        }

                        if (this.z < 10 && omegaPhase !== 'explode' && omegaPhase !== 'corona') this.reset();
                        if (this.z > 2000 && config.behavior !== 'singularity') this.z = 10;
                    }

                    draw(ctx, config, cx, cy) {
                        const scale = fov / (fov + this.z);
                        const x2d = (this.x * scale) + cx;
                        const y2d = (this.y * scale) + cy;
                        
                        let radius2d = Math.max(0.2, (2 * scale));
                        
                        if (config.behavior === 'singularity') {
                            radius2d += Math.sin(this.pulse) * 4 * scale; 
                        }
                        
                        radius2d = Math.max(0.1, radius2d);
                        
                        let opacity = Math.min(1, Math.max(0, 1 - (this.z / 1500)));
                        if (omegaPhase === 'explode' || omegaPhase === 'corona') opacity = Math.min(1, opacity * 2);

                        ctx.beginPath();
                        ctx.arc(x2d, y2d, radius2d, 0, Math.PI * 2);
                        
                        const activeColor = this.pColor || config.color;
                        const colorMatch = activeColor.match(/rgba\((\d+),\s*(\d+),\s*(\d+)/);
                        
                        if (colorMatch) {
                            ctx.fillStyle = `rgba(${colorMatch[1]}, ${colorMatch[2]}, ${colorMatch[3]}, ${opacity})`;
                            ctx.shadowColor = `rgba(${colorMatch[1]}, ${colorMatch[2]}, ${colorMatch[3]}, 1)`;
                        } else {
                            ctx.fillStyle = `rgba(255,255,255,${opacity})`;
                            ctx.shadowColor = 'white';
                        }
                        
                        ctx.shadowBlur = config.glow * scale;
                        ctx.fill();
                        ctx.shadowBlur = 0; 

                        return { x: x2d, y: y2d, scale, opacity, activeColor };
                    }
                }

                const initParticles = () => {
                    particles = [];
                    const isMobile = window.innerWidth < 768;
                    const particleCount = isMobile ? Math.min(window.innerWidth / 3, 150) : Math.min(window.innerWidth / 4, 400); 
                    for (let i = 0; i < particleCount; i++) {
                        particles.push(new Particle());
                    }
                };

                const animate = () => {
                    mouseRef.current.x += (mouseRef.current.targetX - mouseRef.current.x) * 0.05;
                    mouseRef.current.y += (mouseRef.current.targetY - mouseRef.current.y) * 0.05;

                    // Dynamic background logic for a lighter, glowing burst
                    let targetR = 2, targetG = 6, targetB = 23, bgAlpha = 0.45;
                    
                    if (omegaPhase === 'explode' || omegaPhase === 'corona') {
                        targetR = 30; targetG = 25; targetB = 55; // Lighter, beautiful cosmic purple/blue base
                        bgAlpha = 0.25; // Lower alpha for beautiful flowing motion trails
                    }
                    if (omegaPhase === 'explode' && omegaTimer < 220) {
                        // The initial blinding flash
                        const flashIntensity = Math.max(0, 1 - ((omegaTimer - 180) / 40));
                        targetR = 30 + (200 * flashIntensity);
                        targetG = 25 + (220 * flashIntensity);
                        targetB = 55 + (200 * flashIntensity);
                        bgAlpha = 0.7; // Brighter flash coverage
                    }
                    
                    bgColor.r += (targetR - bgColor.r) * 0.05;
                    bgColor.g += (targetG - bgColor.g) * 0.05;
                    bgColor.b += (targetB - bgColor.b) * 0.05;

                    ctx.fillStyle = `rgba(${Math.round(bgColor.r)}, ${Math.round(bgColor.g)}, ${Math.round(bgColor.b)}, ${bgAlpha})`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    const targetConfig = eraConfig[activeEra] || eraConfig.hero;
                    
                    currentConfig.speed += (targetConfig.speed - currentConfig.speed) * 0.03;
                    currentConfig.connectDistance += (targetConfig.connectDistance - currentConfig.connectDistance) * 0.03;
                    currentConfig.glow += (targetConfig.glow - currentConfig.glow) * 0.03;
                    currentConfig.behavior = targetConfig.behavior;
                    currentConfig.color = targetConfig.color;

                    // Omega Implosion/Explosion Logic
                    if (currentConfig.behavior === 'singularity') {
                        if (omegaPhase !== 'corona') {
                            omegaTimer++;
                        }
                        
                        if (omegaTimer < 180) {
                            omegaPhase = 'implode';
                        } else if (omegaTimer === 180) {
                            omegaPhase = 'explode';
                            particles.forEach(p => {
                                const angle = Math.random() * Math.PI * 2;
                                const speed = 40 + Math.random() * 120; // Much more powerful and expansive burst
                                p.vx = Math.sin(angle) * speed;
                                p.vy = Math.cos(angle) * speed;
                                p.vz = (Math.random() - 0.5) * 150; 
                                
                                const pColors = [
                                    'rgba(255, 255, 255, 1)', 'rgba(253, 224, 71, 1)', 
                                    'rgba(45, 212, 191, 1)', 'rgba(236, 72, 153, 1)'
                                ];
                                p.pColor = pColors[Math.floor(Math.random() * pColors.length)];
                            });
                        } else if (omegaTimer > 250 && omegaPhase === 'explode') {
                            omegaPhase = 'corona'; 
                        }
                    } else {
                        omegaTimer = 0;
                        omegaPhase = 'implode'; 
                    }

                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    const projected = [];

                    for (let i = 0; i < particles.length; i++) {
                        particles[i].update(currentConfig, mouseRef.current);
                        const p2d = particles[i].draw(ctx, currentConfig, cx, cy);
                        projected.push({...p2d, particle: particles[i]});
                    }

                    if (['web', 'entangled', 'singularity'].includes(currentConfig.behavior) && omegaPhase !== 'explode' && omegaPhase !== 'corona') {
                        ctx.lineWidth = 0.5;
                        for (let i = 0; i < projected.length; i++) {
                            for (let j = i + 1; j < projected.length; j++) {
                                const p1 = projected[i];
                                const p2 = projected[j];
                                
                                const zDist = Math.abs(p1.particle.z - p2.particle.z);
                                if (zDist > 250) continue; 

                                const dx = p1.x - p2.x;
                                const dy = p1.y - p2.y;
                                const distance = Math.sqrt(dx * dx + dy * dy);
                                
                                const scaledConnectDist = currentConfig.connectDistance * ((p1.scale + p2.scale) / 2);

                                if (distance < scaledConnectDist) {
                                    ctx.beginPath();
                                    ctx.moveTo(p1.x, p1.y);
                                    ctx.lineTo(p2.x, p2.y);
                                    
                                    let lineOpacity = (1 - distance / scaledConnectDist) * Math.min(p1.opacity, p2.opacity) * 0.8;
                                    if(currentConfig.behavior === 'singularity') lineOpacity *= 1.8; 

                                    const colorMatch = currentConfig.color.match(/rgba\((\d+),\s*(\d+),\s*(\d+)/);
                                    if(colorMatch) {
                                        ctx.strokeStyle = `rgba(${colorMatch[1]}, ${colorMatch[2]}, ${colorMatch[3]}, ${lineOpacity})`;
                                        ctx.stroke();
                                    }
                                }
                            }
                        }
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };

                window.addEventListener('resize', resize);
                resize();
                animate();

                return () => {
                    window.removeEventListener('resize', resize);
                    window.removeEventListener('mousemove', handleMouseMove);
                    cancelAnimationFrame(animationFrameId);
                };
            }, [activeEra]);

            return (
                <canvas ref={canvasRef} className="fixed inset-0 z-0 pointer-events-none" style={{ background: '#020617' }} />
            );
        };

        const FadeInSection = ({ children, id, setActiveEra, eraName, className = "" }) => {
            const domRef = useRef();
            const [isVisible, setVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach((entry) => {
                            if (entry.isIntersecting) {
                                setVisible(true);
                                setActiveEra(eraName);
                            }
                        });
                    },
                    { threshold: 0.35, rootMargin: "-10% 0px -10% 0px" } 
                );

                const { current } = domRef;
                if (current) observer.observe(current);
                return () => {
                    if (current) observer.unobserve(current);
                };
            }, [eraName, setActiveEra]);

            return (
                <div
                    id={id}
                    ref={domRef}
                    className={`transition-all duration-[1500ms] ease-[cubic-bezier(0.16,1,0.3,1)] transform ${
                        isVisible ? 'opacity-100 translate-y-0 filter-none scale-100' : 'opacity-0 translate-y-20 blur-[6px] scale-[0.97]'
                    } min-h-screen flex items-center justify-center relative z-10 py-24 px-4 sm:px-8 ${className}`}
                >
                    {children}
                </div>
            );
        };

        const SectionHeading = ({ chapter, title, subtitle, gradient }) => (
            <div className="text-center mb-20 relative z-10 flex flex-col items-center">
                <div className="inline-flex items-center gap-4 mb-6 opacity-80 interactive-hover">
                    <div className="h-[1px] w-12 md:w-24 bg-gradient-to-r from-transparent to-white/50"></div>
                    <h2 className="text-xs md:text-sm font-mono tracking-[0.5em] uppercase text-white font-semibold">{chapter}</h2>
                    <div className="h-[1px] w-12 md:w-24 bg-gradient-to-l from-transparent to-white/50"></div>
                </div>
                <h1 className={`text-5xl md:text-6xl lg:text-[7rem] font-serif tracking-tighter leading-[0.95] bg-clip-text text-transparent bg-gradient-to-b ${gradient} pb-4 drop-shadow-[0_0_30px_rgba(255,255,255,0.1)] interactive-hover transition-transform duration-500 hover:scale-[1.02]`}>
                    {title}
                </h1>
                <p className="mt-6 text-slate-300 max-w-3xl mx-auto text-base md:text-xl font-light leading-relaxed mix-blend-screen opacity-90">
                    {subtitle}
                </p>
            </div>
        );

        const App = () => {
            const [activeEra, setActiveEra] = useState('hero');
            const [scrollProgress, setScrollProgress] = useState(0);

            useEffect(() => {
                const handleScroll = () => {
                    const totalScroll = document.documentElement.scrollTop;
                    const windowHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    const scroll = `${totalScroll / windowHeight}`;
                    setScrollProgress(scroll);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div className="bg-slate-950 text-white min-h-screen font-sans selection:bg-white/30 overflow-x-hidden cursor-none">
                    <CinematicOverlays />
                    <CinematicCanvas activeEra={activeEra} />
                    
                    <div className="fixed top-0 left-0 h-[2px] bg-white z-50 transition-all duration-75 shadow-[0_0_15px_rgba(255,255,255,0.8)]" style={{ width: `${scrollProgress * 100}%` }}></div>

                    <nav className="fixed right-6 top-1/2 transform -translate-y-1/2 z-50 hidden lg:flex flex-col gap-5 mix-blend-difference">
                        {['hero', 'fractal', 'synthetic', 'quantum', 'omega'].map((era) => (
                            <div 
                                key={era} 
                                className={`w-[2px] rounded-full transition-all duration-700 ease-in-out ${activeEra === era ? 'h-20 bg-white shadow-[0_0_20px_rgba(255,255,255,1)]' : 'h-4 bg-white/20 hover:bg-white/60'}`}
                            />
                        ))}
                    </nav>

                    <main className="max-w-7xl mx-auto relative z-10">
                        
                        <FadeInSection id="hero" setActiveEra={setActiveEra} eraName="hero">
                            <div className="text-center max-w-5xl mx-auto flex flex-col items-center">
                                <div className="inline-flex items-center gap-3 px-6 py-2 rounded-full bg-white/5 border border-white/10 mb-12 backdrop-blur-xl shadow-2xl relative overflow-hidden interactive-hover transition-transform hover:scale-105 duration-300">
                                    <div className="absolute inset-0 bg-gradient-to-r from-white/0 via-white/10 to-white/0 translate-x-[-100%] animate-[shimmer_3s_infinite]"></div>
                                    <Icon name="Infinity" size={14} className="text-white/80 animate-[float_4s_ease-in-out_infinite]" />
                                    <span className="text-xs font-mono font-medium tracking-[0.3em] text-white/90 uppercase">An Ontological Exploration</span>
                                </div>
                                
                                <h1 className="text-5xl md:text-7xl lg:text-[7.5rem] font-serif tracking-tighter leading-[1] mb-8 text-white drop-shadow-2xl interactive-hover transition-transform duration-700 hover:scale-[1.02]">
                                    The Cosmic <br/>
                                    <span className="italic font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-yellow-400 drop-shadow-[0_0_40px_rgba(232,121,249,0.5)] tracking-[0.05em] uppercase">Architecture.</span>
                                </h1>
                                
                                <p className="text-lg md:text-2xl text-slate-300 font-light mb-20 max-w-3xl leading-relaxed mix-blend-screen opacity-90">
                                    Intelligence is not a mere artifact of humanity. From the macrocosm of swirling galaxy clusters to the microcosm of the biological double helix, existence speaks a single, repeating fractal language. The universe is written in code, driving toward its ultimate teleological attractor, and held together by "The WORD."
                                </p>
                                
                                <div className="animate-[float_2s_ease-in-out_infinite] p-4 rounded-full bg-white/5 border border-white/20 backdrop-blur-xl hover:bg-white/10 transition-all shadow-[0_0_30px_rgba(255,255,255,0.05)] interactive-hover cursor-pointer"
                                     onClick={() => document.getElementById('fractal').scrollIntoView({ behavior: 'smooth' })}>
                                    <Icon name="ChevronDown" size={24} className="text-white/80" />
                                </div>
                            </div>
                        </FadeInSection>

                        <FadeInSection id="fractal" setActiveEra={setActiveEra} eraName="fractal">
                            <div className="w-full">
                                <SectionHeading 
                                    chapter="Chapter I"
                                    title="As Above, So Below"
                                    subtitle="The ancient maxim reveals a deep structural truth. Under the Lambda-CDM model, galaxies cling to an invisible scaffold. Look up at the cosmic web of dark matter, and then look inward at your own neural pathways. The geometry is identical."
                                    gradient="from-white via-sky-200 to-sky-700"
                                />

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center max-w-5xl mx-auto">
                                    <div className="space-y-8">
                                        <div className="relative group interactive-hover glass-card">
                                            <div className="absolute -inset-1 bg-gradient-to-r from-sky-400 to-blue-500 rounded-[2rem] blur-lg opacity-10 group-hover:opacity-30 transition duration-700"></div>
