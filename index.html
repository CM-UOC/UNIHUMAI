        :root {

            0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 15px rgba(113,229,255,0.4)); }

        .cursor-none { cursor: none; }

        .glass-card {
            position: relative;
            background: rgba(14, 22, 45, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(162, 188, 255, 0.12);

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;

            transform: translateY(-6px) scale(1.005);
            border-color: rgba(113, 229, 255, 0.25);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        /* Controles de Onda SVG */
        .wave-board {
            position: relative;
            min-height: 200px;
            overflow: hidden;
            border: 1px solid rgba(142, 180, 251, 0.15);
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(15, 23, 50, 0.8), rgba(6, 10, 26, 0.95));
        }
        .wave-board::before {
            position: absolute;
            inset: 0;
            content: "";
            opacity: 0.3;
            background-image: linear-gradient(rgba(136, 174, 245, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(136, 174, 245, 0.08) 1px, transparent 1px);

        }
        .wave-path {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke 400ms ease;
        }

        /* Barra de progreso de lectura */
        .scroll-progress-bar {
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--cyan), var(--violet), var(--coral), var(--amber));

        const LanguageContext = createContext();

        const FadeInSection = ({ children, id, setActiveEra, eraName, className = "" }) => {
            const domRef = useRef();
            const [isVisible, setVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    (entries) => {
                        entries.forEach((entry) => {
                            if (entry.isIntersecting) {
                                setVisible(true);
                                setActiveEra(eraName);
                            }
                        });
                    },
                    { threshold: 0.35, rootMargin: "-10% 0px -10% 0px" } 
                );
                const { current } = domRef;
                if (current) observer.observe(current);
                return () => { if (current) observer.unobserve(current); };
            }, [eraName, setActiveEra]);

            return (
                <div
                    id={id}
                    ref={domRef}
                    className={`transition-all duration-[1500ms] ease-[cubic-bezier(0.16,1,0.3,1)] transform ${
                        isVisible ? 'opacity-100 translate-y-0 filter-none scale-100' : 'opacity-0 translate-y-20 blur-[6px] scale-[0.97]'

                    setPosition({ x: e.clientX, y: e.clientY });

                        target.tagName.toLowerCase() === 'button' ||

                const configs = {
                    hero: { speed: 0.4, connectDist: 120, color: 'rgba(113, 229, 255, 0.45)', behavior: 'drift', glow: 6 },
                    fractal: { speed: 0.15, connectDist: 260, color: 'rgba(168, 140, 255, 0.5)', behavior: 'web', glow: 12 },
                    synthetic: { speed: 2.8, connectDist: 150, color: 'rgba(255, 171, 139, 0.65)', behavior: 'stream', glow: 10 },
                    quantum: { speed: 1.8, connectDist: 300, color: 'rgba(155, 245, 192, 0.55)', behavior: 'entangled', glow: 18 },
                    omega: { speed: 0.01, connectDist: 480, color: 'rgba(253, 224, 71, 0.85)', behavior: 'singularity', glow: 30 }
                };

                let curConfig = { ...configs.hero };
                let omegaTimer = 0;
                let phase = 'implode';
                let bg = { r: 2, g: 6, b: 23 };

                const onMove = (e) => {
                    mouse.current.targetX = (e.clientX / window.innerWidth - 0.5) * 2;
                    mouse.current.targetY = (e.clientY / window.innerHeight - 0.5) * 2;
                };
                window.addEventListener('mousemove', onMove);

                const onResize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    buildParticles();
                };

                class Node {
                    constructor() {
                        this.init();
                        this.z = Math.random() * 1500;
                        this.col = null;
                    }
                    init() {
                        this.x = (Math.random() - 0.5) * canvas.width * 3;
                        this.y = (Math.random() - 0.5) * canvas.height * 3;
                        this.z = 1500 + Math.random() * 500;
                        this.vx = (Math.random() - 0.5) * 1.8;
                        this.vy = (Math.random() - 0.5) * 1.8;
                        this.vz = -Math.random() * 2 - 0.4;
                        this.ang = Math.random() * Math.PI * 2;
                        this.pulse = Math.random() * Math.PI;
                        this.col = null;
                    }
                    update(config, m) {
                        this.x -= m.x * 1.2;
                        this.y -= m.y * 1.2;

                        if (config.behavior === 'drift') {
                            this.z += this.vz * config.speed;
                            this.x += this.vx * config.speed;
                            this.y += this.vy * config.speed;
                        } else if (config.behavior === 'web') {
                            this.z += (this.vz * 0.12) * config.speed;
                            this.x += Math.sin(this.ang) * 0.4;
                            this.y += Math.cos(this.ang) * 0.4;
                            this.ang += 0.003;
                        } else if (config.behavior === 'stream') {
                            this.z += (this.vz * 4.2) * config.speed;
                            this.ang += 0.08;
                            this.x += Math.sin(this.ang) * 3;
                        } else if (config.behavior === 'entangled') {
                            this.z += this.vz * config.speed;
                            this.ang += 0.12;
                            this.x += (Math.random() - 0.5) * 20;
                            this.y += (Math.random() - 0.5) * 20;
                        } else if (config.behavior === 'singularity') {
                            if (phase === 'implode') {
                                this.x += (0 - this.x) * 0.025;
                                this.y += (0 - this.y) * 0.025;
                                this.z += (700 - this.z) * 0.025;
                                this.pulse += 0.1;
                            } else {
                                this.x += this.vx;
                                this.y += this.vy;
                                this.z += this.vz;
                                this.vx *= 0.95;
                                this.vy *= 0.95;
                                this.vz *= 0.95;
                                this.pulse += 0.12;

                                if (phase === 'corona') {
                                    this.ang += 0.025;
                                    this.x += Math.sin(this.ang * 1.6) * 3.5 + this.vx * 0.5;
                                    this.y += Math.cos(this.ang * 1.6) * 3.5 + this.vy * 0.5;
                                    this.x += this.x * 0.003;
                                    this.y += this.y * 0.003;
                                    this.z += this.vz * 0.45;

                                    if (this.z < -200 || this.z > 2500 || Math.abs(this.x) > 2200 || Math.abs(this.y) > 2200 || Math.random() < 0.008) {
                                        this.x = (Math.random() - 0.5) * 20;
                                        this.y = (Math.random() - 0.5) * 20;
                                        this.z = 700 + (Math.random() - 0.5) * 60;
                                        const a = Math.random() * Math.PI * 2;
                                        const s = 3 + Math.random() * 9;
                                        this.vx = Math.sin(a) * s;
                                        this.vy = Math.cos(a) * s;
                                        this.vz = (Math.random() - 0.5) * 12;
                                        this.ang = a;
                                        
                                        const palette = [
                                            'rgba(255, 255, 255, 1)',
                                            'rgba(113, 229, 255, 1)', // turquesa
                                            'rgba(168, 140, 255, 1)', // violeta
                                            'rgba(255, 171, 139, 1)', // coral
                                            'rgba(253, 224, 71, 1)'   // amarillo
                                        ];
                                        this.col = palette[Math.floor(Math.random() * palette.length)];
                                    }
                                }
                            }
                        }

                        if (this.z < 10 && phase !== 'explode' && phase !== 'corona') this.init();
                        if (this.z > 2200 && config.behavior !== 'singularity') this.z = 10;
                    }
                    draw(scale, cx, cy) {
                        const x2d = (this.x * scale) + cx;
                        const y2d = (this.y * scale) + cy;
                        let r = Math.max(0.2, (2.2 * scale));

                        if (curConfig.behavior === 'singularity') r += Math.sin(this.pulse) * 3 * scale;
                        r = Math.max(0.1, r);

                        let op = Math.min(1, Math.max(0, 1 - (this.z / 1600)));
                        if (phase === 'explode' || phase === 'corona') op = Math.min(1, op * 2.5);

                        ctx.beginPath();
                        ctx.arc(x2d, y2d, r, 0, Math.PI * 2);
                        
                        const actualCol = this.col || curConfig.color;
                        const rgbMatch = actualCol.match(/rgba\((\d+),\s*(\d+),\s*(\d+)/);
                        
                        if (rgbMatch) {
                            ctx.fillStyle = `rgba(${rgbMatch[1]}, ${rgbMatch[2]}, ${rgbMatch[3]}, ${op})`;
                            ctx.shadowColor = `rgba(${rgbMatch[1]}, ${rgbMatch[2]}, ${rgbMatch[3]}, 1)`;
                        } else {
                            ctx.fillStyle = `rgba(255,255,255,${op})`;
                            ctx.shadowColor = 'white';
                        }
                        ctx.shadowBlur = curConfig.glow * scale;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        return { x: x2d, y: y2d, scale, op, color: actualCol };
                    }
                }

                const buildParticles = () => {
                    particles = [];
                    const count = window.innerWidth < 768 ? 120 : 320;
                    for(let i = 0; i < count; i++) particles.push(new Node());
                };

                const loop = () => {
                    mouse.current.x += (mouse.current.targetX - mouse.current.x) * 0.05;
                    mouse.current.y += (mouse.current.targetY - mouse.current.y) * 0.05;

                    let bgR = 2, bgG = 6, bgB = 23, alpha = 0.45;

                    if (phase === 'explode' || phase === 'corona') {
                        bgR = 15; bgG = 12; bgB = 32;
                        alpha = 0.22;
                    }
                    if (phase === 'explode' && omegaTimer < 220) {
                        const intensity = Math.max(0, 1 - ((omegaTimer - 180) / 40));
                        bgR = 15 + (180 * intensity);
                        bgG = 12 + (190 * intensity);
                        bgB = 32 + (180 * intensity);
                        alpha = 0.65;
                    }

                    bg.r += (bgR - bg.r) * 0.06;
                    bg.g += (bgG - bg.g) * 0.06;
                    bg.b += (bgB - bg.b) * 0.06;

                    ctx.fillStyle = `rgba(${Math.round(bg.r)}, ${Math.round(bg.g)}, ${Math.round(bg.b)}, ${alpha})`;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    const targetCfg = configs[activeEra] || configs.hero;
                    curConfig.speed += (targetCfg.speed - curConfig.speed) * 0.035;
                    curConfig.connectDist += (targetCfg.connectDist - curConfig.connectDist) * 0.035;
                    curConfig.glow += (targetCfg.glow - curConfig.glow) * 0.035;
                    curConfig.behavior = targetCfg.behavior;
                    curConfig.color = targetCfg.color;

                    if (curConfig.behavior === 'singularity') {
                        if (phase !== 'corona') omegaTimer++;
                        if (omegaTimer < 180) {
                            phase = 'implode';
                        } else if (omegaTimer === 180) {
                            phase = 'explode';
                            particles.forEach(p => {
                                const angle = Math.random() * Math.PI * 2;
                                const speed = 35 + Math.random() * 110;
                                p.vx = Math.sin(angle) * speed;
                                p.vy = Math.cos(angle) * speed;
                                p.vz = (Math.random() - 0.5) * 130;

                                const colors = [
                                    'rgba(255, 255, 255, 1)', 'rgba(113, 229, 255, 1)', 
                                    'rgba(168, 140, 255, 1)', 'rgba(255, 171, 139, 1)', 'rgba(253, 224, 71, 1)'
                                ];
                                p.col = colors[Math.floor(Math.random() * colors.length)];
                            });
                        } else if (omegaTimer > 250 && phase === 'explode') {
                            phase = 'corona';
                        }
                    } else {
                        omegaTimer = 0;
                        phase = 'implode';
                    }

                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    const projected = [];

                    for(let i=0; i<particles.length; i++) {
                        particles[i].update(curConfig, mouse.current);
                        const scale = fov / (fov + particles[i].z);
                        const p2d = particles[i].draw(scale, cx, cy);
                        projected.push({ ...p2d, node: particles[i], scale });
                    }

                    // Trazado de conexiones inter-partícula (Redes cuánticas y fractales)
                    if (['web', 'entangled', 'singularity'].includes(curConfig.behavior) && phase !== 'explode' && phase !== 'corona') {
                        ctx.lineWidth = 0.55;
                        for (let i = 0; i < projected.length; i++) {
                            for (let j = i + 1; j < projected.length; j++) {
                                const p1 = projected[i];
                                const p2 = projected[j];

                                const zDist = Math.abs(p1.node.z - p2.node.z);
                                if (zDist > 220) continue;

                                const dx = p1.x - p2.x;
                                const dy = p1.y - p2.y;
                                const dist = Math.sqrt(dx * dx + dy * dy);
                                const currentMaxDist = curConfig.connectDist * ((p1.scale + p2.scale) / 2);

                                if (dist < currentMaxDist) {
                                    ctx.beginPath();
                                    ctx.moveTo(p1.x, p1.y);
                                    ctx.lineTo(p2.x, p2.y);
                                    
                                    let linkOp = (1 - dist / currentMaxDist) * Math.min(p1.op, p2.op) * 0.75;
                                    if(curConfig.behavior === 'singularity') linkOp *= 1.7;

                                    const match = curConfig.color.match(/rgba\((\d+),\s*(\d+),\s*(\d+)/);
                                    if(match) {
                                        ctx.strokeStyle = `rgba(${match[1]}, ${match[2]}, ${match[3]}, ${linkOp})`;
                                        ctx.stroke();
                                    }
                                }
                            }
                        }
                    }
                    frameId = requestAnimationFrame(loop);
                };

                window.addEventListener('resize', onResize);
                onResize();
                loop();

                return () => {
                    window.removeEventListener('resize', onResize);
                    window.removeEventListener('mousemove', onMove);
                    cancelAnimationFrame(frameId);
                };
            }, [activeEra]);

            return <canvas ref={canvasRef} className="fixed inset-0 z-0 pointer-events-none bg-slate-950" />;
        };

        // Sección Avanzada: Laboratorio de Cuerdas Dinámico con Parámetros Matemáticos

                    <div className="mt-6 p-4 rounded-xl bg-white/5 border border-white/10">

        // Sección Avanzada: Simulador Dinámico de Compuertas Cuánticas (Hadamard / Pauli-X / CNOT)
        const QuantumGateSimulator = () => {
            const { t } = useContext(LanguageContext);
            const [qubits, setQubits] = useState([
                { id: 0, state: '0', superposition: false, phase: 0 },
                { id: 1, state: '1', superposition: false, phase: 0 },
                { id: 2, state: '0', superposition: false, phase: 0 }
            ]);

            const applyHadamard = (id) => {
                setQubits(qubits.map(q => {
                    if (q.id === id) {
                        return { ...q, superposition: !q.superposition, state: q.superposition ? '0' : t('simSup') };
                    }
                    return q;
                }));
            };

            const applyPauliX = (id) => {
                setQubits(qubits.map(q => {
                    if (q.id === id) {
                        return { ...q, state: q.state === '0' ? '1' : q.state === '1' ? '0' : q.state };
                    }
                    return q;
                }));
            };

            const resetQubits = () => {
                setQubits([
                    { id: 0, state: '0', superposition: false, phase: 0 },
                    { id: 1, state: '1', superposition: false, phase: 0 },
                    { id: 2, state: '0', superposition: false, phase: 0 }
                ]);
            };

            return (
                <div className="glass-card p-8 interactive-hover relative group border-lime-500/20">
                    <div className="absolute top-0 right-0 p-3 bg-white/5 border-l border-b border-white/10 rounded-bl-xl text-[10px] font-mono tracking-wider text-lime-400">

                        {t('simDesc')}

                                {q.superposition && (
                                    <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(155,245,192,0.15),transparent_75%)] animate-pulse" />
                                )}
                                <span className="text-[10px] font-mono tracking-widest text-slate-400 uppercase mb-3">Qubit [{q.id}]</span>
                                
                                <div className={`w-16 h-16 rounded-full border-2 flex items-center justify-center mb-6 transition-all duration-500 ${q.superposition ? 'border-dashed border-lime-400 animate-spin [animation-duration:8s]' : 'border-solid border-slate-600'}`}>
                                    <span className={`text-xl font-mono font-bold ${q.superposition ? 'text-lime-300' : 'text-slate-300'}`}>
                                        {q.superposition ? 'ψ' : q.state}
                                    </span>
                                </div>

                                <div className="grid grid-cols-2 gap-2 w-full z-10">
                                    <button 
                                        onClick={() => applyHadamard(q.id)}
                                        className="py-1.5 rounded-lg bg-white/5 border border-white/10 text-[10px] font-mono hover:bg-lime-400 hover:text-slate-950 hover:border-lime-400 transition-all duration-300"
                                    >
                                        {t('simH')}
                                    </button>
                                    <button 
                                        onClick={() => applyPauliX(q.id)}
                                        className="py-1.5 rounded-lg bg-white/5 border border-white/10 text-[10px] font-mono hover:bg-cyan-400 hover:text-slate-950 hover:border-cyan-400 transition-all duration-300"
                                    >
                                        {t('simX')}
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="flex gap-4">
                        <button 
                            onClick={resetQubits}
                            className="px-6 py-2.5 rounded-full bg-white/10 text-white text-xs font-bold font-mono tracking-widest uppercase hover:bg-white/20 transition-all border border-white/10"
                        >
                            {t('simReset')}
                        </button>
                    </div>
                </div>
            );
        };

        const AppContent = () => {
            const { t, lang, setLang } = useContext(LanguageContext);
            const [activeEra, setActiveEra] = useState('hero');
            const [scrollProgress, setScrollProgress] = useState(0);

            useEffect(() => {
                const onScroll = () => {
                    const total = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    if(total > 0) setScrollProgress((document.documentElement.scrollTop / total) * 100);
                };
                window.addEventListener('scroll', onScroll, { passive: true });
                return () => window.removeEventListener('scroll', onScroll);
            }, []);

            return (
                <div className="bg-slate-950 text-white min-h-screen relative overflow-hidden">
                    <div className="scroll-progress-bar" style={{ width: `${scrollProgress}%` }} />
                    <div className="film-grain" />
                    <CustomCursor />

                    <header className="fixed top-0 inset-x-0 z-[500] px-6 md:px-12 py-5 flex justify-between items-center backdrop-blur-md border-b border-white/10 bg-slate-950/80">
                        <div className="flex items-center gap-3 text-white text-xs font-bold tracking-[0.2em] uppercase font-mono">
                            <div className="w-8 h-8 rounded-full border border-cyan-400 flex items-center justify-center shadow-[inset_0_0_12px_rgba(113,229,255,0.3)] animate-pulse">
                                <div className="w-2.5 h-2.5 rounded-full bg-cyan-400 shadow-[0_0_10px_#71e5ff]"></div>
                            </div>
                            {t('headerTitle')}
                        </div>
                        <div className="flex items-center gap-4">
                            <nav className="hidden md:flex gap-1.5 p-1 bg-white/5 border border-white/10 rounded-full">
                                {['navOrigin', 'navSymphony', 'navSilicon', 'navQuantum', 'navConcordance', 'navOmega'].map((tabKey, idx) => {
                                    const targets = ['hero', 'fractal', 'synthetic', 'quantum', 'biblical', 'omega'];
                                    const eraMapping = ['hero', 'fractal', 'synthetic', 'quantum', 'quantum', 'omega'];
                                    return (
                                        <button 
                                            key={tabKey}
                                            onClick={() => {
                                                document.getElementById(targets[idx])?.scrollIntoView({ behavior: 'smooth' });
                                                setActiveEra(eraMapping[idx]);
                                            }}
                                            className={`px-4 py-2 rounded-full text-xs font-bold tracking-widest transition-all duration-500 uppercase ${activeEra === eraMapping[idx] ? 'bg-white text-slate-900 shadow-xl' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                                        >
                                            {t(tabKey)}
                                        </button>
                                    );
                                })}
                            </nav>
                            <button 
                                onClick={() => setLang(lang === 'es' ? 'en' : 'es')}
                                className="w-10 h-10 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 border border-white/20 transition-all text-white font-bold text-xs"
                                title="Cambiar Idioma / Change Language"
                            >
                                {t('langSwitch')}
                            </button>
                        </div>
                    </header>

                    <CosmicEngine activeEra={activeEra} />

                    <main className="max-w-7xl mx-auto relative z-10 pt-24">
                        
                        {/* SECCIÓN HERO */}
                        <FadeInSection id="hero" setActiveEra={setActiveEra} eraName="hero">
                            <div className="text-center max-w-5xl mx-auto flex flex-col items-center">
                                <div className="inline-flex items-center gap-3 px-6 py-2 rounded-full bg-white/5 border border-cyan-400/30 mb-12 backdrop-blur-xl shadow-2xl relative overflow-hidden interactive-hover transition-transform hover:scale-105 duration-300">
                                    <div className="absolute inset-0 bg-gradient-to-r from-cyan-400/0 via-cyan-400/15 to-cyan-400/0 translate-x-[-100%] animate-[shimmer_3s_infinite]"></div>
                                    <Icon name="Infinity" size={14} className="text-cyan-400 animate-[float_4s_ease-in-out_infinite]" />
                                    <span className="text-xs font-mono font-medium tracking-[0.3em] text-cyan-200 uppercase">{t('heroTag')}</span>
                                </div>
                                
                                <h1 className="text-5xl md:text-7xl lg:text-[7.5rem] font-serif tracking-tighter leading-[1] mb-8 text-white drop-shadow-2xl interactive-hover transition-transform duration-700 hover:scale-[1.02]">
                                    {t('heroTitle1')} <br/>
                                    <span className="italic font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-violet-400 to-coral-400 drop-shadow-[0_0_40px_rgba(168,140,255,0.4)] tracking-[0.05em] uppercase">{t('heroTitle2')}</span>
                                </h1>
                                
                                <p className="text-lg md:text-2xl text-slate-300 font-light mb-16 max-w-3xl leading-relaxed mix-blend-screen opacity-90">
                                    {t('heroDesc')}
                                </p>
                                
                                <button 
                                    onClick={() => document.getElementById('fractal').scrollIntoView({ behavior: 'smooth' })}
                                    className="animate-[float_2s_ease-in-out_infinite] p-4 rounded-full bg-white/5 border border-white/20 backdrop-blur-xl hover:bg-white/10 transition-all shadow-[0_0_30px_rgba(255,255,255,0.05)] interactive-hover"
                                >
                                    <Icon name="ChevronDown" size={24} className="text-cyan-400" />
                                </button>
                            </div>
                        </FadeInSection>

                        {/* CAPÍTULO I */}
                        <FadeInSection id="fractal" setActiveEra={setActiveEra} eraName="fractal">
                            <div className="w-full">
                                <SectionHeading 
                                    chapter={t('chap1')}
                                    title={t('chap1Title')}
                                    subtitle={t('chap1Sub')}
                                    gradient="from-white via-cyan-200 to-cyan-700"
                                />

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center max-w-6xl mx-auto">
                                    <div className="space-y-8">
                                        <div className="relative group interactive-hover glass-card p-8">
                                            <Icon name="Activity" size={40} className="text-cyan-400 mb-6 stroke-[1.2] group-hover:animate-[float_3s_ease-in-out_infinite]" />
                                            <h3 className="text-2xl font-serif text-white mb-3">{t('chap1Card1Title')}</h3>
                                            <p className="text-base text-slate-300 font-light leading-relaxed">
                                                {t('chap1Card1Desc')}
                                            </p>
                                        </div>

                                        <div className="relative group interactive-hover glass-card p-8 border-violet-500/20">
                                            <Icon name="Grid" size={40} className="text-violet-400 mb-6 stroke-[1.2] group-hover:animate-[float_3s_ease-in-out_infinite]" />
                                            <h3 className="text-2xl font-serif text-white mb-3">{t('chap1Card2Title')}</h3>
                                            <p className="text-base text-slate-300 font-light leading-relaxed">
                                                {t('chap1Card2Desc')}
                                            </p>
                                        </div>
                                    </div>

                                    <div className="w-full">
                                        <QuantumStringLab />
                                    </div>
                                </div>
                            </div>
                        </FadeInSection>

                        {/* CAPÍTULO II */}
                        <FadeInSection id="synthetic" setActiveEra={setActiveEra} eraName="synthetic">
                            <div className="w-full">
                                <SectionHeading 
                                    chapter={t('chap2')}
                                    title={t('chap2Title')}
                                    subtitle={t('chap2Sub')}
                                    gradient="from-white via-violet-300 to-violet-800"
                                />

                                <div className="max-w-4xl mx-auto interactive-hover glass-card p-10 md:p-14 group">
                                    <div className="absolute top-0 right-0 -mt-24 -mr-24 w-[30rem] h-[30rem] bg-violet-600/10 rounded-full blur-[80px] group-hover:bg-violet-600/20 group-hover:scale-110 transition-all duration-1000"></div>
                                    <div className="relative z-10">
                                        <Icon name="Cpu" size={48} className="text-violet-400 mb-8 stroke-[1] group-hover:animate-[float_3s_ease-in-out_infinite]" />
                                        <h3 className="text-3xl md:text-4xl font-serif text-white mb-6 leading-tight">{t('chap2CardTitle')}</h3>
                                        <p className="text-lg md:text-xl text-slate-300 font-light leading-relaxed mb-6">
                                            {t('chap2CardP1')}
                                        </p>
                                        <p className="text-lg md:text-xl text-slate-300 font-light leading-relaxed">
                                            {t('chap2CardP2')}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </FadeInSection>

                        {/* CAPÍTULO III */}
                        <FadeInSection id="quantum" setActiveEra={setActiveEra} eraName="quantum">
                            <div className="w-full">
                                 <SectionHeading 
                                    chapter={t('chap3')}
                                    title={t('chap3Title')}
                                    subtitle={t('chap3Sub')}
                                    gradient="from-white via-lime-200 to-lime-700"
                                />

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 max-w-6xl mx-auto items-center">
                                    <div className="space-y-6">
                                        <div className="glass-card p-8 border-lime-500/20 group interactive-hover">
                                            <Icon name="Atom" size={40} className="text-lime-300 mb-4 stroke-[1.2] group-hover:scale-110 transition-transform" />
                                            <h3 className="text-xl font-serif text-white mb-2">{t('chap3Card1Title')}</h3>
                                            <p className="text-slate-300 font-light text-sm leading-relaxed">
                                                {t('chap3Card1Desc')}
                                            </p>
                                        </div>

                                        <div className="glass-card p-8 border-cyan-500/20 group interactive-hover">
                                            <Icon name="Zap" size={40} className="text-cyan-400 mb-4 stroke-[1.2] group-hover:scale-110 transition-transform" />
                                            <h3 className="text-xl font-serif text-white mb-2">{t('chap3Card2Title')}</h3>
                                            <p className="text-slate-300 font-light text-sm leading-relaxed">
                                                {t('chap3Card2Desc')}
                                            </p>
                                        </div>
                                    </div>

                                    <div className="w-full">
                                        <QuantumGateSimulator />
                                    </div>
                                </div>
                            </div>
                        </FadeInSection>

                        {/* SECCIÓN AVANZADA: CONCORDANCIA BIBLICA */}
                        <FadeInSection id="biblical" setActiveEra={setActiveEra} eraName="quantum">
                            <div className="w-full">
                                <SectionHeading 
                                    chapter={t('chap4')}
                                    title={t('chap4Title')}
                                    subtitle={t('chap4Sub')}
                                    gradient="from-white via-amber-200 to-amber-700"
                                />

                                <div className="max-w-5xl mx-auto px-4">
                                    <BiblicalConcordance />
                                </div>
                            </div>
                        </FadeInSection>

                        {/* CAPÍTULO FINAL: OMEGA */}
                        <FadeInSection id="omega" setActiveEra={setActiveEra} eraName="omega">
                            <div className="w-full">
                                <div className="text-center mb-12 relative z-10 interactive-hover">
                                     <h2 className="text-xs font-mono tracking-[0.5em] uppercase text-amber-400 font-medium mb-8">{t('omegaTag')}</h2>
                                    <h1 className="text-5xl md:text-7xl lg:text-[7.5rem] font-serif tracking-tighter text-white pb-2 drop-shadow-2xl transition-transform duration-700 hover:scale-105 leading-tight">
                                        {t('omegaTitle1')} <br/>
                                        <span className="font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-600 drop-shadow-[0_0_80px_rgba(253,224,71,0.95)] uppercase tracking-wide">
                                            {t('omegaTitle2')}
                                        </span>
                                    </h1>
                                </div>

                                <div className="relative p-[1px] rounded-[2.5rem] overflow-hidden group max-w-4xl mx-auto shadow-[0_0_80px_rgba(253,224,71,0.2)] interactive-hover glass-card mt-16">
                                    <div className="absolute inset-0 bg-gradient-to-r from-amber-500/30 via-white/30 to-orange-500/30 opacity-50 group-hover:opacity-100 transition-opacity duration-1000" style={{ mixBlendMode: 'overlay' }}></div>
                                    
                                    <div className="relative bg-slate-950/85 backdrop-blur-3xl p-10 md:p-16 text-center rounded-[2.5rem] border border-amber-500/30 flex flex-col items-center">
                                         
                                         <div className="relative mb-12 mt-4 animate-[pulse-slow_4s_infinite]">
                                             <Icon name="Sun" size={90} className="text-amber-100 relative z-10 stroke-[1]" />
                                         </div>
                                         
                                         <h2 className="text-3xl md:text-5xl font-serif text-white mb-8 leading-tight">
                                             {t('omegaFace')}
                                         </h2>
                                         
                                         <div className="text-lg md:text-xl text-slate-300 font-light max-w-3xl leading-relaxed space-y-8">
                                             <p>{t('omegaP1')}</p>
                                             <p>{t('omegaP2')}</p>
                                             <p className="text-amber-100 font-medium text-2xl font-serif mt-12 py-4">
                                                 {t('omegaP3')}<br/><br/>
                                                 <span className="text-6xl md:text-7xl font-bold tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-amber-200 to-amber-400 drop-shadow-[0_0_40px_rgba(253,224,71,0.7)]">I AM. / YO SOY.</span>
                                             </p>
                                         </div>

                                         <div className="mt-16 text-center max-w-2xl mx-auto border-t border-white/10 pt-16">
                                            <h4 className="text-[10px] font-mono text-amber-400 mb-8 tracking-[0.4em] uppercase flex items-center justify-center gap-4">
                                                <div className="w-8 h-[1px] bg-amber-400/30"></div>
                                                {t('omegaSign')}
                                                <div className="w-8 h-[1px] bg-amber-400/30"></div>
                                            </h4>
                                            <p className="text-xl md:text-2xl font-serif text-slate-100 italic leading-loose opacity-95 drop-shadow-lg">
                                                {t('omegaPoemL1')}<br/>
                                                {t('omegaPoemL2')}<br/>
                                                {t('omegaPoemL3')}<br/>
                                                {t('omegaPoemL4')}<br/>
                                                {t('omegaPoemL5')}<br/>
                                                {t('omegaPoemL6')}
                                            </p>
                                         </div>
                                    </div>
                                </div>

                                <footer className="mt-32 pb-12 text-slate-500 text-[10px] font-mono tracking-[0.4em] uppercase flex flex-col items-center opacity-40 hover:opacity-100 transition-opacity duration-700 cursor-pointer">
                                    <Icon name="Hexagon" size={20} className="mb-4 animate-[spin_10s_linear_infinite]" />
                                    <p className="mb-2">{t('footer')}</p>
                                </footer>
                            </div>
                        </FadeInSection>
                        
                    </main>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('es'); // Idioma por defecto

            useEffect(() => {
                document.documentElement.lang = lang;
                document.title = dict[lang].title;
            }, [lang]);

            const t = (key) => dict[lang][key] || key;

            return (
                <LanguageContext.Provider value={{ lang, setLang, t }}>
                    <AppContent />
                </LanguageContext.Provider>
            );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
