<!doctype html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PM Runway — Product Manager preparation for GIS:Hub</title>
<meta name="description" content="A personalised product management learning platform and interview preparation system, built around Cristian Malpica's CV and portfolio and the Volkswagen GIS:Hub Product Manager role.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1015" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2314181f'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='Georgia,serif' fill='%23f6f5f2'>R</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<script>
  /* set theme before first paint to avoid a flash */
  try {
    var t = localStorage.getItem('pmrunway.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    if (localStorage.getItem('pmrunway.focus') === '1') document.documentElement.setAttribute('data-focus', 'true');
  } catch (e) {}
</script>
</head>
<body>
<a href="#main" class="sr-only">Skip to content</a>

<div class="app">
  <header class="topbar">
    <button class="iconbtn navtoggle" id="navToggle" aria-label="Open navigation" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <a class="brand" href="#/dashboard">
      <span class="brand__mark">R</span>
      <span class="brand__txt">
        <span class="brand__name">PM Runway</span>
        <span class="brand__sub">GIS:Hub · Product Manager</span>
      </span>
    </a>

    <div class="searchbox focus-hide">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      <input class="input" id="globalSearch" type="search" placeholder="Search concepts, questions, terms…" aria-label="Search the whole site" autocomplete="off">
      <kbd>/</kbd>
    </div>

    <button class="iconbtn" id="focusToggle" aria-label="Toggle distraction-free mode" aria-pressed="false" title="Focus mode">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
    </button>
    <button class="iconbtn" id="themeToggle" aria-label="Switch colour theme" title="Theme">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Main"></nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<noscript>
  <div style="padding:2rem;max-width:60ch;margin:0 auto">
    <h1>PM Runway</h1>
    <p>This preparation platform is interactive and needs JavaScript enabled. Everything it stores — your notes, answers, confidence ratings and progress — lives only in this browser.</p>
  </div>
</noscript>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
