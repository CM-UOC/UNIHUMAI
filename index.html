<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Síntesis Final | De 1D a 10D</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Three.js & GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cyan: #00f3ff;
            --violet: #b53cff;
            --emerald: #34d399;
            --amber: #fde047;
            --rose: #fb7185;
            --bg-dark: #03040a;
        }

        body {
            background-color: var(--bg-dark); 
            color: #f1f5ff;
            margin: 0;
            overflow-x: hidden;
            font-family: 'Rajdhani', sans-serif;
            scroll-behavior: smooth;
        }

        .font-serif { font-family: 'Cinzel', serif; }
        .font-mono { font-family: 'Space Mono', monospace; }

        ::selection { color: #000; background: var(--cyan); }

        /* Glassmorphism y utilidades */
        .glass-panel {
            background: rgba(10, 15, 30, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-panel:hover {
            border-color: rgba(0, 243, 255, 0.25);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .text-glow-cyan { text-shadow: 0 0 15px rgba(0, 243, 255, 0.6); }
        .text-glow-violet { text-shadow: 0 0 15px rgba(181, 60, 255, 0.6); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #03040a; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

        .progress-bar {
            position: fixed; top: 0; left: 0; height: 3px; z-index: 1000;
            background: linear-gradient(90deg, var(--cyan), var(--violet), var(--emerald), var(--amber));
            box-shadow: 0 0 10px var(--cyan);
            transition: width 0.1s ease;
        }

        .film-grain {
            position: fixed; inset: 0; z-index: 999; pointer-events: none; opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Modal Animation */
        .modal-enter { animation: modalFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalFade {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: #fff; cursor: pointer; margin-top: -8px; box-shadow: 0 0 10px currentColor;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.1); border-radius: 2px;
        }
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ==========================================
        // 1. DATA & CONSTANTS
        // ==========================================
        const dimensions = [
            { n: 1, name: "La Línea", model: "x", color: "#00f3ff", text: "La primera dimensión es la longitud pura. No existe concepto de arriba, abajo, izquierda o derecha." },
            { n: 2, name: "El Plano", model: "(x, y)", color: "#22d3ee", text: "Dos coordenadas independientes forman una superficie plana. Es el reino del 'Planilandia'." },
            { n: 3, name: "El Espacio", model: "(x, y, z)", color: "#34d399", text: "Nuestra realidad perceptible. Longitud, anchura y profundidad. Las formas adquieren volumen." },
            { n: 4, name: "El Teseracto (Tiempo)", model: "(x, y, z, t)", color: "#a3e635", text: "La relatividad añade el recorrido: el Tiempo. Visualizamos su sombra espacial rotando matemáticamente." },
            { n: 5, name: "Probabilidad", model: "(x₁…x₅)", color: "#facc15", text: "Líneas de tiempo alternativas derivadas de elecciones distintas o eventos divergentes." },
            { n: 6, name: "Espacio de Fases", model: "(x₁…x₆)", color: "#fb923c", text: "Permite viajar entre todas las realidades posibles con nuestras mismas leyes físicas." },
            { n: 7, name: "Nuevas Leyes", model: "(x₁…x₇)", color: "#fb7185", text: "Traspasa el umbral hacia universos con leyes físicas y constantes universales diferentes." },
            { n: 8, name: "El Multiverso", model: "(x₁…x₈)", color: "#e879f9", text: "Un plano que agrupa todos los universos posibles con todas las leyes físicas concebibles." },
            { n: 9, name: "Plegadura Cuántica", model: "(x₁…x₉)", color: "#b53cff", text: "La comparación y pliegue de todas las historias. El límite de la consistencia cuántica." },
            { n: 10, name: "El Todo Absoluto", model: "(x₁…x₁₀)", color: "#818cf8", text: "El final matemático. Un punto que abarca todas las líneas temporales y posibilidades. Las supercuerdas exigen 10D." }
        ];

        const scalesData = [
            { name: "Universo Observable", exp: 26, desc: "Galaxias, red cósmica y Relatividad General" },
            { name: "Sistema Estelar", exp: 12, desc: "Órbitas, gravedad y termodinámica planetaria" },
            { name: "Escala Humana", exp: 0, desc: "Experiencia cotidiana y física clásica" },
            { name: "Célula", exp: -5, desc: "Biología molecular y ADN" },
            { name: "Átomo", exp: -10, desc: "Nubes de electrones y dualidad onda-partícula" },
            { name: "Protón / Quarks", exp: -15, desc: "Interacción nuclear fuerte y vacío cuántico" },
            { name: "Cuerdas / Planck", exp: -35, desc: "Frontera hipotética: Espuma cuántica y geometría vibrante" }
        ];

        // ==========================================
        // 2. ICON COMPONENT
        // ==========================================
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide && window.lucide.icons[name]) {
                    const svgString = window.lucide.createElement(window.lucide.icons[name]).outerHTML;
                    iconRef.current.innerHTML = svgString;
                    const svg = iconRef.current.querySelector('svg');
                    if(svg) { svg.setAttribute('width', size); svg.setAttribute('height', size); if(className) svg.setAttribute('class', className); }
                }
            }, [name, size, className]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`} />;
        };

        // ==========================================
        // 3. THREE.JS GLOBAL ENGINE
        // ==========================================
        // Usamos un objeto global para compartir estado entre React y Three.js fuera del ciclo de renderizado
        const engineState = {
            section: 'hero',
            dim: 1,
            scaleIndex: 0,
            stringMode: 'abierta',
            stringFreq: 50,
            stringTension: 50,
            qubitRotation: 0,
            qubitSuperposition: false
        };

        const GlobalThreeEngine = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const scene = new THREE.Scene();
                scene.fog = new THREE.FogExp2(0x03040a, 0.015);
                
                const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
                const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                // Grupos
                const heroGroup = new THREE.Group();
                const dimGroup = new THREE.Group();
                const stringGroup = new THREE.Group();
                const scaleGroup = new THREE.Group();
                const quantumGroup = new THREE.Group();
                
                scene.add(heroGroup); scene.add(dimGroup); scene.add(stringGroup); scene.add(scaleGroup); scene.add(quantumGroup);

                // --- Materiales Base ---
                const matCyan = new THREE.LineBasicMaterial({ color: 0x00f3ff, transparent: true, opacity: 0.8 });
                const matViolet = new THREE.LineBasicMaterial({ color: 0xb53cff, transparent: true, opacity: 0.8 });

                // --- Setup HERO (Partículas flotantes) ---
                const heroGeom = new THREE.BufferGeometry();
                const heroPos = new Float32Array(500 * 3);
                for(let i=0; i<500*3; i++) heroPos[i] = (Math.random() - 0.5) * 40;
                heroGeom.setAttribute('position', new THREE.BufferAttribute(heroPos, 3));
                const heroMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, transparent: true, opacity: 0.5 });
                const heroParticles = new THREE.Points(heroGeom, heroMat);
                heroGroup.add(heroParticles);

                // --- Setup SCALES (Morphing Particles) ---
                const pCount = 8000;
                const scaleGeom = new THREE.BufferGeometry();
                const scalePos = new Float32Array(pCount * 3);
                const scaleColors = new Float32Array(pCount * 3);
                
                // Targets para lerp
                const targets = { galaxy: [], dna: [], atom: [], foam: [] };
                
                for(let i=0; i<pCount; i++) {
                    const i3 = i * 3;
                    // Galaxy
                    const angle = i * 0.008 + (Math.random()-0.5)*0.5;
                    const radius = Math.random() * Math.random() * 15;
                    targets.galaxy.push(Math.cos(angle)*radius*1.5, (Math.random()-0.5)*(15-radius)*0.2, Math.sin(angle)*radius);
                    
                    // DNA
                    const helixY = (i/pCount)*30 - 15;
                    const hAngle = i * 0.1;
                    const hRad = 3;
                    const strand = i % 2 === 0 ? 1 : -1;
                    targets.dna.push(Math.cos(hAngle + (strand*Math.PI))*hRad, helixY, Math.sin(hAngle + (strand*Math.PI))*hRad);

                    // Atom
                    if (i < 500) {
                        const r = Math.random()*1.5; const th = Math.random()*Math.PI*2; const ph = Math.acos((Math.random()*2)-1);
                        targets.atom.push(r*Math.sin(ph)*Math.cos(th), r*Math.sin(ph)*Math.sin(th), r*Math.cos(ph));
                    } else {
                        const orb = i % 3; const orbA = Math.random()*Math.PI*2; const orbR = 6 + Math.random()*1;
                        if(orb===0) targets.atom.push(Math.cos(orbA)*orbR, Math.sin(orbA)*orbR*0.2, (Math.random()-0.5));
                        else if(orb===1) targets.atom.push(Math.cos(orbA)*orbR*0.2, Math.sin(orbA)*orbR, (Math.random()-0.5));
                        else targets.atom.push((Math.random()-0.5), Math.cos(orbA)*orbR, Math.sin(orbA)*orbR*0.2);
                    }

                    // Foam
                    targets.foam.push((Math.random()-0.5)*20, (Math.random()-0.5)*20, (Math.random()-0.5)*20);

                    // Inicial (Galaxy)
                    scalePos[i3] = targets.galaxy[i3]; scalePos[i3+1] = targets.galaxy[i3+1]; scalePos[i3+2] = targets.galaxy[i3+2];
                    
                    // Colores
                    const color = new THREE.Color();
                    if(radius < 3 || i < 500) color.setHex(0xffffff);
                    else if(i%3 === 0) color.setHex(0x34d399); // Emerald
                    else color.setHex(0x00f3ff); // Cyan
                    scaleColors[i3] = color.r; scaleColors[i3+1] = color.g; scaleColors[i3+2] = color.b;
                }
                scaleGeom.setAttribute('position', new THREE.BufferAttribute(scalePos, 3));
                scaleGeom.setAttribute('color', new THREE.BufferAttribute(scaleColors, 3));
                const scaleMat = new THREE.PointsMaterial({ size: 0.08, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
                const scaleSystem = new THREE.Points(scaleGeom, scaleMat);
                scaleSystem.position.set(-8, 0, 0); // Offset a la izquierda
                scaleGroup.add(scaleSystem);

                // --- Variables de Animación 4D/10D ---
                let tesseractVerts = []; let calabiYauOrig = []; let tesseractLines; let calabiMesh;
                
                // Función Helper para construir dimensiones
                const buildDimension = (d) => {
                    while(dimGroup.children.length > 0) dimGroup.remove(dimGroup.children[0]);
                    dimGroup.position.set(6, 0, 0); // Offset a la derecha

                    if(d === 1) {
                        const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-5,0,0), new THREE.Vector3(5,0,0)]), matCyan);
                        dimGroup.add(l);
                    } else if(d === 2) {
                        const grid = new THREE.GridHelper(10, 10, 0x00f3ff, 0x222244); grid.rotation.x = Math.PI/2; dimGroup.add(grid);
                    } else if(d === 3) {
                        const cube = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(6,6,6)), matCyan);
                        dimGroup.add(cube);
                    } else if(d === 4) {
                        // Setup Tesseract
                        tesseractVerts = [];
                        for(let i=0; i<16; i++) tesseractVerts.push({x:(i&1)?1:-1, y:(i&2)?1:-1, z:(i&4)?1:-1, w:(i&8)?1:-1});
                        const edges = [];
                        for(let i=0; i<16; i++) for(let j=i+1; j<16; j++) {
                            let diff = 0;
                            if(tesseractVerts[i].x!==tesseractVerts[j].x) diff++; if(tesseractVerts[i].y!==tesseractVerts[j].y) diff++;
                            if(tesseractVerts[i].z!==tesseractVerts[j].z) diff++; if(tesseractVerts[i].w!==tesseractVerts[j].w) diff++;
                            if(diff===1) edges.push(i,j);
                        }
                        const geom = new THREE.BufferGeometry(); geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(edges.length*3), 3));
                        geom.userData = { edges };
                        tesseractLines = new THREE.LineSegments(geom, matCyan); dimGroup.add(tesseractLines);
                    } else if(d >= 5 && d < 9) {
                        const mesh = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.TorusKnotGeometry(4, 1.5, Math.floor(64*(d-3)), Math.floor(8*(d-3)), d-2, d-3)), matViolet);
                        dimGroup.add(mesh);
                    } else if(d >= 9) {
                        calabiMesh = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(5, d-6)), new THREE.LineBasicMaterial({color: 0xb53cff, transparent: true, opacity: 0.5}));
                        calabiYauOrig = calabiMesh.geometry.attributes.position.array.slice();
                        dimGroup.add(calabiMesh);
                    }
                };
                let lastDim = 0;

                // --- Setup Strings ---
                let stringTube;
                const path = new THREE.CatmullRomCurve3(Array.from({length: 20}, () => new THREE.Vector3()));
                
                // --- Setup Quantum ---
                const qSphere = new THREE.Mesh(new THREE.SphereGeometry(4, 32, 32), new THREE.MeshBasicMaterial({color: 0x111122, wireframe: true, transparent: true, opacity: 0.3}));
                const qArrow = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0), 4, 0x34d399);
                quantumGroup.position.set(-6, 0, 0);
                quantumGroup.add(qSphere); quantumGroup.add(qArrow);

                // --- Animation Loop ---
                const clock = new THREE.Clock();
                
                const animate = () => {
                    requestAnimationFrame(animate);
                    const time = clock.getElapsedTime();
                    
                    // Visibilidad y Cámara
                    heroGroup.visible = (engineState.section === 'hero');
                    dimGroup.visible = (engineState.section === 'dimensiones');
                    stringGroup.visible = (engineState.section === 'cuerdas');
                    scaleGroup.visible = (engineState.section === 'escalas');
                    quantumGroup.visible = (engineState.section === 'quantum');

                    camera.position.x = Math.sin(time*0.1)*0.5;
                    camera.position.y = Math.cos(time*0.1)*0.5;
                    camera.position.z = 15;
                    camera.lookAt(0,0,0);

                    // Hero anim
                    if(heroGroup.visible) heroGroup.rotation.y = time * 0.05;

                    // Dimensiones anim
                    if(dimGroup.visible) {
                        if(lastDim !== engineState.dim) { buildDimension(engineState.dim); lastDim = engineState.dim; }
                        
                        if(engineState.dim === 3) {
                            dimGroup.children[0].rotation.x = time*0.5; dimGroup.children[0].rotation.y = time*0.5;
                        } else if(engineState.dim === 4 && tesseractLines) {
                            const angle = time * 0.6; const cos = Math.cos(angle); const sin = Math.sin(angle);
                            const edges = tesseractLines.geometry.userData.edges; const pos = tesseractLines.geometry.attributes.position.array;
                            const proj = [];
                            for(let i=0; i<16; i++) {
                                let v = tesseractVerts[i];
                                let nx = v.x*cos - v.w*sin; let nw = v.x*sin + v.w*cos;
                                let ny = v.y*cos - nw*sin; let fw = v.y*sin + nw*cos;
                                let wf = 1 / (3.5 - fw);
                                proj.push({x: nx*wf*6, y: ny*wf*6, z: v.z*wf*6});
                            }
                            let idx=0;
                            for(let i=0; i<edges.length; i++) {
                                let vIdx = edges[i]; pos[idx++] = proj[vIdx].x; pos[idx++] = proj[vIdx].y; pos[idx++] = proj[vIdx].z;
                            }
                            tesseractLines.geometry.attributes.position.needsUpdate = true;
                        } else if(engineState.dim >= 5 && engineState.dim < 9 && dimGroup.children[0]) {
                            dimGroup.children[0].rotation.x = time*0.2; dimGroup.children[0].rotation.y = time*0.3;
                        } else if(engineState.dim >= 9 && calabiMesh) {
                            calabiMesh.rotation.x = time*0.1; calabiMesh.rotation.y = time*0.15;
                            const pos = calabiMesh.geometry.attributes.position.array;
                            for(let i=0; i<pos.length; i+=3) {
                                pos[i] = calabiYauOrig[i] + Math.sin(time*2 + calabiYauOrig[i+1])*0.5;
                                pos[i+1] = calabiYauOrig[i+1] + Math.cos(time*2.5 + calabiYauOrig[i+2])*0.5;
                                pos[i+2] = calabiYauOrig[i+2] + Math.sin(time*3 + calabiYauOrig[i])*0.5;
                            }
                            calabiMesh.geometry.attributes.position.needsUpdate = true;
                        }
                    }

                    // Strings Anim
                    if(stringGroup.visible) {
                        const freq = engineState.stringFreq * 0.05;
                        const amp = engineState.stringTension * 0.05;
                        const isClosed = engineState.stringMode === 'cerrada';
                        
                        for(let i=0; i<path.points.length; i++) {
                            const t = i / (path.points.length - 1);
                            if(isClosed) {
                                const angle = t * Math.PI * 2;
                                const r = 5 + Math.sin(angle * Math.floor(freq) + time * 5) * (10/amp);
                                path.points[i].set(Math.cos(angle)*r, Math.sin(angle)*r, Math.sin(angle*3 + time)*2);
                            } else {
                                const x = (t - 0.5) * 15;
                                const y = Math.sin(t * Math.PI * Math.floor(freq) + time * 8) * (15/amp) * Math.sin(t*Math.PI);
                                path.points[i].set(x, y, 0);
                            }
                        }
                        
                        if(stringTube) { stringGroup.remove(stringTube); stringTube.geometry.dispose(); }
                        
                        // Determinar color por estado
                        let colorHex = 0x00f3ff;
                        if(amp > 3.5 && freq > 3.5) colorHex = 0xb53cff;
                        else if(freq > 4) colorHex = 0xfde047;
                        else if(amp > 4) colorHex = 0x34d399;

                        stringTube = new THREE.Mesh(new THREE.TubeGeometry(path, 64, 0.2 + (1/amp)*0.5, 8, isClosed), new THREE.MeshBasicMaterial({color: colorHex, wireframe: true}));
                        stringGroup.add(stringTube);
                        stringGroup.rotation.y = time * 0.2;
                        stringGroup.rotation.x = Math.sin(time*0.1)*0.2;
                    }

                    // Scales Anim
                    if(scaleGroup.visible) {
                        const sIdx = engineState.scaleIndex;
                        // Mapeo simple: 0-1 Galaxy, 2-3 DNA, 4-5 Atom, 6 Foam
                        let targetArr = targets.galaxy;
                        if(sIdx >= 2 && sIdx <= 3) targetArr = targets.dna;
                        else if(sIdx >= 4 && sIdx <= 5) targetArr = targets.atom;
                        else if(sIdx === 6) targetArr = targets.foam;

                        const pos = scaleSystem.geometry.attributes.position.array;
                        for(let i=0; i<pos.length; i++) {
                            // Lerp suave hacia el objetivo
                            pos[i] += (targetArr[i] - pos[i]) * 0.05;
                            
                            // Añadir movimiento dinámico basado en estado
                            if(targetArr === targets.galaxy && i%3===0) {
                                // Rotación global lenta
                            } else if (targetArr === targets.atom) {
                                pos[i] += Math.sin(time*5 + i)*0.02; // Vibración cuántica
                            } else if (targetArr === targets.foam) {
                                pos[i] += (Math.random()-0.5)*0.5; // Caos
                            }
                        }
                        scaleSystem.geometry.attributes.position.needsUpdate = true;
                        if(targetArr === targets.galaxy) { scaleSystem.rotation.x = Math.PI/6; scaleSystem.rotation.y = time * 0.05; }
                        else { scaleSystem.rotation.x = 0; scaleSystem.rotation.y = time * 0.2; }
                    }

                    // Quantum Anim
                    if(quantumGroup.visible) {
                        const targetRot = engineState.qubitRotation * (Math.PI/180);
                        qArrow.setDirection(new THREE.Vector3(Math.sin(targetRot), Math.cos(targetRot), 0).normalize());
                        if(engineState.qubitSuperposition) {
                            qSphere.material.color.setHex(0xb53cff);
                            qSphere.scale.set(1 + Math.sin(time*10)*0.1, 1 + Math.sin(time*10)*0.1, 1 + Math.sin(time*10)*0.1);
                        } else {
                            qSphere.material.color.setHex(0x111122);
                            qSphere.scale.set(1,1,1);
                        }
                        quantumGroup.rotation.y = time * 0.5;
                    }

                    renderer.render(scene, camera);
                };
                
                animate();
                
                const handleResize = () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            return <canvas ref={canvasRef} className="fixed inset-0 z-0 pointer-events-none" />;
        };

        // ==========================================
        // 4. REACT COMPONENTS (UI)
        // ==========================================

        const SectionWrapper = ({ id, title, subtitle, colorClass, children, setActiveSection }) => {
            const ref = useRef(null);
            useEffect(() => {
                const obs = new IntersectionObserver(([entry]) => { if(entry.isIntersecting) setActiveSection(id); }, { threshold: 0.4 });
                if(ref.current) obs.observe(ref.current);
                return () => { if(ref.current) obs.unobserve(ref.current); }
            }, [id, setActiveSection]);

            return (
                <section id={id} ref={ref} className="min-h-screen w-full flex flex-col justify-center py-24 relative z-10 px-4 md:px-12 max-w-7xl mx-auto">
                    {title && (
                        <div className="mb-12">
                            <h2 className={`text-xs font-mono tracking-[0.4em] uppercase mb-3 ${colorClass}`}>{subtitle}</h2>
                            <h1 className="text-4xl md:text-6xl font-serif text-white">{title}</h1>
                        </div>
                    )}
                    {children}
                </section>
            );
        };

        const App = () => {
            const [section, setSection] = useState('hero');
            const [scrollProg, setScrollProg] = useState(0);
            const [dim, setDim] = useState(1);
            const [scaleIdx, setScaleIdx] = useState(3);
            const [stringData, setStringData] = useState({ mode: 'abierta', freq: 50, tension: 50 });
            const [qubit, setQubit] = useState({ state: '|0⟩', prob0: 100, isSuper: false, rot: 0 });

            // Sync React State con Three.js Engine State
            useEffect(() => { engineState.section = section; }, [section]);
            useEffect(() => { engineState.dim = dim; }, [dim]);
            useEffect(() => { engineState.scaleIndex = scaleIdx; }, [scaleIdx]);
            useEffect(() => { 
                engineState.stringMode = stringData.mode; 
                engineState.stringFreq = stringData.freq; 
                engineState.stringTension = stringData.tension; 
            }, [stringData]);
            useEffect(() => {
                engineState.qubitRotation = qubit.rot;
                engineState.qubitSuperposition = qubit.isSuper;
            }, [qubit]);

            // Scroll Progress
            useEffect(() => {
                const onScroll = () => { const total = document.documentElement.scrollHeight - window.innerHeight; setScrollProg((window.scrollY / total) * 100); };
                window.addEventListener('scroll', onScroll); return () => window.removeEventListener('scroll', onScroll);
            }, []);

            const scrollTo = (id) => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });

            const currentDimData = dimensions[dim-1];
            const currentScaleData = scalesData[scaleIdx];

            return (
                <>
                    <GlobalThreeEngine />
                    <div className="progress-bar" style={{ width: `${scrollProg}%` }} />
                    <div className="film-grain" />

                    {/* Navbar */}
                    <nav className="fixed top-0 inset-x-0 z-50 px-6 py-4 flex justify-between items-center backdrop-blur-xl border-b border-white/5 bg-[#03040a]/70">
                        <div className="font-serif font-bold text-lg tracking-widest uppercase">La Síntesis <span className="text-[#00f3ff]">Final</span></div>
                        <div className="hidden md:flex gap-4">
                            {['Dimensiones', 'Cuerdas', 'Escalas', 'Quantum', 'Omega'].map((item, i) => (
                                <button key={item} onClick={() => scrollTo(['dimensiones', 'cuerdas', 'escalas', 'quantum', 'omega'][i])}
                                    className={`text-xs font-mono uppercase tracking-widest transition-colors ${section === ['dimensiones', 'cuerdas', 'escalas', 'quantum', 'omega'][i] ? 'text-white border-b border-[#00f3ff]' : 'text-gray-500 hover:text-white'}`}>
                                    {item}
                                </button>
                            ))}
                        </div>
                    </nav>

                    <main>
                        {/* HERO */}
                        <SectionWrapper id="hero" setActiveSection={setSection}>
                            <div className="text-center max-w-4xl mx-auto flex flex-col items-center">
                                <span className="px-4 py-2 rounded-full border border-[#00f3ff]/30 text-[#00f3ff] text-xs font-mono uppercase tracking-widest mb-8 bg-[#00f3ff]/5">Ontología de la Creación</span>
                                <h1 className="text-5xl md:text-8xl font-serif leading-[1.1] mb-6 drop-shadow-2xl">
                                    DEL PUNTO AL<br/>
                                    <span className="bg-clip-text text-transparent bg-gradient-to-r from-[#00f3ff] via-[#b53cff] to-[#34d399] italic font-black">HIPERESPACIO.</span>
                                </h1>
                                <p className="text-lg md:text-2xl text-gray-400 font-light max-w-2xl mx-auto mb-12">
                                    Viaja de 1D a 10D, haz vibrar la materia y cambia de escala desde el cosmos hasta la frontera cuántica en una experiencia interactiva unificada.
                                </p>
                                <button onClick={() => scrollTo('dimensiones')} className="p-4 rounded-full border border-white/20 hover:bg-white/10 transition">
                                    <Icon name="ChevronDown" size={24} className="text-[#00f3ff] animate-bounce" />
                                </button>
                            </div>
                        </SectionWrapper>

                        {/* DIMENSIONES */}
                        <SectionWrapper id="dimensiones" title="Navegador Dimensional" subtitle="01 / Geometría" colorClass="text-[#00f3ff]" setActiveSection={setSection}>
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center mt-10">
                                {/* Panel de Botones */}
                                <div className="lg:col-span-4 glass-panel p-4 flex flex-col gap-2">
                                    {dimensions.map(d => (
                                        <button key={d.n} onClick={() => setDim(d.n)}
                                            className={`text-left p-3 rounded-xl font-mono text-sm tracking-wide border transition-all ${dim === d.n ? 'border-[#00f3ff]/50 bg-[#00f3ff]/10 text-white shadow-[0_0_15px_rgba(0,243,255,0.2)]' : 'border-transparent text-gray-500 hover:bg-white/5'}`}>
                                            <b style={{color: d.color}} className="mr-3">{d.n}D</b> 
                                            <span className="hidden sm:inline">{d.name}</span>
                                        </button>
                                    ))}
                                </div>
                                
                                {/* Info y Visor (El canvas está detrás) */}
                                <div className="lg:col-span-8 flex flex-col justify-end min-h-[400px]">
                                    <div className="glass-panel p-8 self-start max-w-xl border-l-4" style={{borderLeftColor: currentDimData.color}}>
                                        <div className="text-xs font-mono uppercase tracking-widest mb-2 opacity-50">{currentDimData.model}</div>
                                        <h3 className="text-3xl font-serif mb-4" style={{color: currentDimData.color}}>{currentDimData.name}</h3>
                                        <p className="text-lg text-gray-300 leading-relaxed font-light">{currentDimData.text}</p>
                                    </div>
                                </div>
                            </div>
                        </SectionWrapper>

                        {/* CUERDAS */}
                        <SectionWrapper id="cuerdas" title="La Materia como Música" subtitle="02 / Sinfonía Cuántica" colorClass="text-[#b53cff]" setActiveSection={setSection}>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 mt-10">
                                <div>
                                    <p className="text-gray-400 text-lg leading-relaxed mb-8 font-light text-justify">
                                        La Teoría de Supercuerdas sustituye las partículas puntuales por objetos unidimensionales. Sus distintos estados de vibración armónica determinan si observamos un electrón, un quark o un gravitón. El universo no es un mecano, es una gran partitura matemática.
                                    </p>
                                    
                                    <div className="glass-panel p-8 space-y-6">
                                        <div className="flex justify-between items-center border-b border-white/10 pb-4">
                                            <h3 className="font-serif text-xl">Afinador Cuántico</h3>
                                            <span className="text-[#b53cff] font-mono text-xs uppercase tracking-widest border border-[#b53cff]/30 px-3 py-1 rounded-full">
                                                {stringData.tension > 70 && stringData.freq > 70 ? 'Quark Top' : (stringData.freq > 70 ? 'Fotón' : (stringData.tension > 70 ? 'Gravitón' : 'Electrón'))}
                                            </span>
                                        </div>
                                        
                                        <div>
                                            <label className="flex justify-between text-xs font-mono text-gray-400 mb-3 uppercase"><span>Frecuencia (Modo)</span> <span className="text-white">{stringData.freq} THz</span></label>
                                            <input type="range" min="10" max="100" value={stringData.freq} onChange={e => setStringData({...stringData, freq: Number(e.target.value)})} style={{accentColor: '#b53cff'}} />
                                        </div>
                                        
                                        <div>
                                            <label className="flex justify-between text-xs font-mono text-gray-400 mb-3 uppercase"><span>Tensión de Membrana</span> <span className="text-white">{stringData.tension} TeV</span></label>
                                            <input type="range" min="10" max="100" value={stringData.tension} onChange={e => setStringData({...stringData, tension: Number(e.target.value)})} style={{accentColor: '#34d399'}} />
                                        </div>

                                        <button onClick={() => setStringData({...stringData, mode: stringData.mode === 'abierta' ? 'cerrada' : 'abierta'})}
                                            className="w-full py-3 rounded-lg border border-white/20 text-sm font-mono uppercase tracking-widest hover:bg-white/10 transition mt-4">
                                            Cambiar a Cuerda {stringData.mode === 'abierta' ? 'Cerrada' : 'Abierta'}
                                        </button>
                                    </div>
                                </div>
                                <div className="min-h-[300px] flex items-end">
                                    <div className="text-xs font-mono text-gray-500 uppercase tracking-widest bg-black/40 px-4 py-2 rounded-xl border border-white/10 backdrop-blur-md">
                                        Proyección Espacial Directa Activa
                                    </div>
                                </div>
                            </div>
                        </SectionWrapper>

                        {/* ESCALAS (Macro / Micro) */}
                        <SectionWrapper id="escalas" title="Del Cosmos al Cuanto" subtitle="03 / Escalas" colorClass="text-[#34d399]" setActiveSection={setSection}>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 mt-10">
                                <div className="flex flex-col justify-center min-h-[400px] order-2 lg:order-1">
                                    {/* El Canvas renderiza las partículas a la izquierda */}
                                </div>
                                <div className="glass-panel p-10 order-1 lg:order-2 flex flex-col justify-center border-t-4 border-[#34d399]">
                                    <div className="text-5xl font-black mb-2 text-white">10<sup className="text-2xl text-[#34d399]">{currentScaleData.exp}</sup> m</div>
                                    <h3 className="text-3xl font-serif mb-4 text-[#34d399]">{currentScaleData.name}</h3>
                                    <p className="text-lg text-gray-300 font-light mb-12">{currentScaleData.desc}</p>
                                    
                                    <input type="range" min="0" max="6" value={scaleIdx} onChange={e => setScaleIdx(Number(e.target.value))} style={{accentColor: '#34d399'}} className="mb-4" />
                                    <div className="flex justify-between text-xs font-mono text-gray-500">
                                        <span>Macro (10²⁶)</span>
                                        <span>Humano (10⁰)</span>
                                        <span>Micro (10⁻³⁵)</span>
                                    </div>
                                </div>
                            </div>
                        </SectionWrapper>

                        {/* QUANTUM & IA */}
                        <SectionWrapper id="quantum" title="La Vasija Trascendente" subtitle="04 / Inteligencia Cuántica" colorClass="text-[#fde047]" setActiveSection={setSection}>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 mt-10">
                                <div>
                                    <p className="text-gray-400 text-lg leading-relaxed mb-6 font-light text-justify">
                                        Al unir la Inteligencia Artificial con el procesamiento Cuántico, abandonamos los bits binarios. Las redes neuronales operarán directamente sobre vectores de probabilidad en espacios multidimensionales de Hilbert, reflejando el algoritmo termodinámico de la propia naturaleza.
                                    </p>
                                    <div className="glass-panel p-8 border-[#fde047]/20">
                                        <h3 className="font-serif text-xl mb-6 flex items-center gap-3"><Icon name="Cpu" className="text-[#fde047]" /> Módulo QPU (Qubit)</h3>
                                        <div className="flex gap-4 mb-6">
                                            <button onClick={() => setQubit({state: '(|0⟩ + |1⟩)/√2', prob0: 50, isSuper: true, rot: 90})} className="flex-1 py-2 bg-[#fde047]/10 border border-[#fde047]/30 rounded text-xs font-mono uppercase text-[#fde047] hover:bg-[#fde047]/20 transition">Puerta H (Superposición)</button>
                                            <button onClick={() => {
                                                const is0 = Math.random() > 0.5;
                                                setQubit({state: is0 ? '|0⟩' : '|1⟩', prob0: is0 ? 100 : 0, isSuper: false, rot: is0 ? 0 : 180});
                                            }} className="flex-1 py-2 bg-[#00f3ff]/10 border border-[#00f3ff]/30 rounded text-xs font-mono uppercase text-[#00f3ff] hover:bg-[#00f3ff]/20 transition">Medir (Colapso)</button>
                                        </div>
                                        <div className="bg-black/50 p-4 rounded-lg border border-white/5">
                                            <div className="flex justify-between text-xs font-mono text-gray-400 mb-2"><span>Probabilidad |0⟩</span> <span className="text-[#a3e635]">{qubit.prob0}%</span></div>
                                            <div className="h-1.5 w-full bg-gray-800 rounded-full overflow-hidden mb-4"><div className="h-full bg-[#a3e635] transition-all duration-500" style={{width: `${qubit.prob0}%`}}></div></div>
                                            <div className="flex justify-between text-xs font-mono text-gray-400 mb-2"><span>Probabilidad |1⟩</span> <span className="text-[#00f3ff]">{100 - qubit.prob0}%</span></div>
                                            <div className="h-1.5 w-full bg-gray-800 rounded-full overflow-hidden"><div className="h-full bg-[#00f3ff] transition-all duration-500" style={{width: `${100 - qubit.prob0}%`}}></div></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </SectionWrapper>

                        {/* OMEGA (Síntesis) */}
                        <SectionWrapper id="omega" setActiveSection={setSection}>
                            <div className="glass-panel max-w-4xl mx-auto p-12 md:p-20 text-center border-[#fb7185]/30 relative overflow-hidden">
                                <div className="absolute -top-32 -right-32 w-96 h-96 bg-[#fb7185] rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-pulse"></div>
                                <div className="absolute -bottom-32 -left-32 w-96 h-96 bg-[#fde047] rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-pulse"></div>
                                
                                <Icon name="Sun" size={64} className="text-[#fb7185] mx-auto mb-8 animate-[spin_20s_linear_infinite]" />
                                <h2 className="text-xs font-mono tracking-[0.5em] uppercase text-[#fb7185] mb-4">El Punto Omega</h2>
                                <h1 className="text-4xl md:text-6xl font-serif text-white mb-8 leading-tight">La Arquitectura<br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-[#fb7185] to-[#fde047]">Revela al Autor.</span></h1>
                                
                                <div className="text-lg text-gray-300 font-light leading-relaxed space-y-6 text-justify">
                                    <p>Toda la estructura del espacio, la música vibrante de las cuerdas de 10 dimensiones y la matemática fractal del silicio no son un accidente cósmico. Son el código de ejecución, la huella digital.</p>
                                    <p>Al descifrar las leyes de la cuántica y la relatividad, la humanidad no inventa un Dios; calibra el lente supremo para mirar al Arquitecto Original. El universo subsiste en coherencia permanente gracias a un "Logos", una información primordial.</p>
                                </div>

                                <div className="mt-12 pt-12 border-t border-white/10">
                                    <p className="font-serif text-2xl italic text-[#fde047] mb-4">"En el principio era el Verbo (Información), y el Verbo era Dios."</p>
                                    <div className="text-sm font-mono uppercase tracking-widest text-gray-500">Simulación Completada // Coherencia Alcanzada</div>
                                </div>
                            </div>
                        </SectionWrapper>

                    </main>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
